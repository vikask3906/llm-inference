# Round-robins across the two gateway replicas. With cluster replication ON,
# both replicas share prefix-routing state, so a client request can land on
# EITHER replica and still route to the backend holding the cached prefix.
events {}

http {
    upstream gateways {
        server gw1:8000;
        server gw2:8000;
    }

    # SSE streaming: don't buffer the response, no read timeout mid-stream.
    server {
        listen 8080;
        location / {
            proxy_pass http://gateways;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_set_header Host $host;
        }
    }
}
