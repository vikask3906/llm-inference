apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inference-gateway.fullname" . }}-config
  labels:
    {{- include "inference-gateway.labels" . | nindent 4 }}
data:
  # All gateway settings are passed as GW_* env vars. Keeping them in a
  # ConfigMap means the Deployment can mount them as envFrom -- single
  # source of truth, easy to override via helm --set.
  GW_BACKENDS: {{ include "inference-gateway.backendsString" . | quote }}
  GW_STRATEGY: {{ .Values.routing.strategy | quote }}
  GW_BLOCK_CHARS: {{ .Values.routing.blockChars | quote }}
  GW_BLOCK_TOKENS: {{ .Values.routing.blockTokens | quote }}
  GW_HASH_CUTOFF_BLOCKS: {{ .Values.routing.hashCutoffBlocks | quote }}
  GW_BACKEND_CACHE_BLOCKS: {{ .Values.routing.backendCacheBlocks | quote }}
  GW_MAX_RETRIES: {{ .Values.faultTolerance.maxRetries | quote }}
  GW_CIRCUIT_FAIL_THRESHOLD: {{ .Values.faultTolerance.circuitFailThreshold | quote }}
  GW_CIRCUIT_COOLDOWN_S: {{ .Values.faultTolerance.circuitCooldownS | quote }}
  GW_RATE_LIMIT_ENABLED: {{ .Values.tenancy.rateLimitEnabled | quote }}
  GW_PREFIX_ISOLATION: {{ .Values.tenancy.prefixIsolation | quote }}
  GW_DEFAULT_OUTPUT_TOKENS: {{ .Values.tenancy.defaultOutputTokens | quote }}
  GW_MAX_OUTPUT_TOKENS: {{ .Values.tenancy.maxOutputTokens | quote }}
  GW_USE_BPE_HASHING: {{ .Values.extensions.bpeHashing.enabled | quote }}
  GW_TOKENIZER_MODEL: {{ .Values.extensions.bpeHashing.tokenizerModel | quote }}
  GW_TTFT_OBSERVATIONS_PATH: {{ .Values.extensions.ttftPredictor.observationsPath | quote }}
  GW_TTFT_MODEL_PATH: {{ .Values.extensions.ttftPredictor.modelPath | quote }}
  GW_TTFT_PREDICTOR_WEIGHT: {{ .Values.extensions.ttftPredictor.weight | quote }}
  GW_SPECULATIVE_K: {{ .Values.extensions.speculative.k | quote }}
  GW_BACKEND_ADAPTERS: {{ .Values.extensions.lora.backendAdapters | quote }}
  GW_LORA_FALLBACK_TO_BASE: {{ .Values.extensions.lora.fallbackToBase | quote }}
  GW_SEMANTIC_CACHE_ENABLED: {{ .Values.extensions.semanticCache.enabled | quote }}
  GW_SEMANTIC_CACHE_THRESHOLD: {{ .Values.extensions.semanticCache.threshold | quote }}
  GW_SEMANTIC_CACHE_MAX_ENTRIES_PER_TENANT: {{ .Values.extensions.semanticCache.maxEntriesPerTenant | quote }}
  GW_LOG_LEVEL: {{ .Values.observability.logLevel | quote }}
  {{- with .Values.observability.otelEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
