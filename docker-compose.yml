services:
  b0:
    build: .
    command: uvicorn mock_backend.app:app --host 0.0.0.0 --port 9000
    environment: { MOCK_NODE_ID: b0, MOCK_CAP_BLOCKS: "600" }
  b1:
    build: .
    command: uvicorn mock_backend.app:app --host 0.0.0.0 --port 9000
    environment: { MOCK_NODE_ID: b1, MOCK_CAP_BLOCKS: "600" }
  b2:
    build: .
    command: uvicorn mock_backend.app:app --host 0.0.0.0 --port 9000
    environment: { MOCK_NODE_ID: b2, MOCK_CAP_BLOCKS: "600" }

  gateway:
    build: .
    command: uvicorn gateway.server:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      GW_BACKENDS: "b0=http://b0:9000,b1=http://b1:9000,b2=http://b2:9000"
      GW_STRATEGY: prefix_tree
    depends_on: [b0, b1, b2]

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [gateway]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
