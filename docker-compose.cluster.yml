# Horizontal-scaling demo: TWO gateway replicas behind a load balancer, sharing
# prefix-routing state via Redis. A request can hit either replica and still
# route to the backend holding the matching KV prefix -- prefix-aware routing
# that scales out instead of being pinned to one process.
#
#   docker compose -f docker-compose.cluster.yml up --build
#   # load balancer -> http://localhost:8080   (round-robins gw1/gw2)
#   # Grafana       -> http://localhost:3000
#   # drive traffic: python bench/loadtest.py --url http://localhost:8080 --duration 60
services:
  b0:
    build: .
    command: uvicorn mock_backend.app:app --host 0.0.0.0 --port 9000
    environment: { MOCK_NODE_ID: b0, MOCK_CAP_BLOCKS: "600" }
  b1:
    build: .
    command: uvicorn mock_backend.app:app --host 0.0.0.0 --port 9000
    environment: { MOCK_NODE_ID: b1, MOCK_CAP_BLOCKS: "600" }
  b2:
    build: .
    command: uvicorn mock_backend.app:app --host 0.0.0.0 --port 9000
    environment: { MOCK_NODE_ID: b2, MOCK_CAP_BLOCKS: "600" }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  gw1:
    build: .
    command: uvicorn gateway.server:app --host 0.0.0.0 --port 8000
    environment:
      GW_BACKENDS: "b0=http://b0:9000,b1=http://b1:9000,b2=http://b2:9000"
      GW_STRATEGY: prefix_tree
      GW_CLUSTER_ENABLED: "1"
      GW_CLUSTER_TRANSPORT: redis
      GW_CLUSTER_REDIS_URL: "redis://redis:6379/0"
      GW_CLUSTER_REPLICA_ID: gw1
    depends_on: [b0, b1, b2, redis]

  gw2:
    build: .
    command: uvicorn gateway.server:app --host 0.0.0.0 --port 8000
    environment:
      GW_BACKENDS: "b0=http://b0:9000,b1=http://b1:9000,b2=http://b2:9000"
      GW_STRATEGY: prefix_tree
      GW_CLUSTER_ENABLED: "1"
      GW_CLUSTER_TRANSPORT: redis
      GW_CLUSTER_REDIS_URL: "redis://redis:6379/0"
      GW_CLUSTER_REPLICA_ID: gw2
    depends_on: [b0, b1, b2, redis]

  lb:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [gw1, gw2]

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.cluster.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [gw1, gw2]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
